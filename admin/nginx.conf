server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ^~ takes priority over regex blocks below — API and agent paths are
    # always proxied regardless of file extension (.png, .jpg, etc.).
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location ^~ /agent/ {
        proxy_pass http://backend:8080/agent/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $host;
    }

    # Long cache for hashed static assets only (^~ above ensures /api/ paths
    # never reach this regex even when the URL ends in .png or .jpg).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
